apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-blog
  labels:
    app: devops-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-blog
  template:
    metadata:
      labels:
        app: devops-blog
    spec:
      containers:
      - name: devops-blog
        image: localhost/devopsblog:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-blog
  labels:
    app: devops-blog
spec:
  selector:
    app: devops-blog
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP